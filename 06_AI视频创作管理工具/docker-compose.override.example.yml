# 本机覆盖示例（勿提交含个人 IP / 密钥的真实 override）
#
# 用法：
#   cp docker-compose.override.example.yml docker-compose.override.yml
#   按需修改后：docker compose up -d
#
# Docker Compose 会自动合并同目录下的 docker-compose.override.yml。
#
# 说明：
# - 星链云视频参考图走 oss.vjimeng.vip，不依赖 AVM_PUBLIC_BASE_URL / 本机公网 IP。
# - IPv6 公网主要用于「浏览器访问 NAS 上的管理 UI」，不是给 Seedance 拉参考图用的。
# - 端口 IPv6 绑定请改 docker-compose.yml 的 ports（勿在 override 再叠一层同端口，易冲突）。

services:
  ai-video-manager:
    environment:
      # 一般可留空。仅当你仍需要「本机签名公网拉图」遗留能力时再填，例如：
      # AVM_PUBLIC_BASE_URL: "http://[2409:xxxx:xxxx:xxxx::x]:8010"
      AVM_PUBLIC_BASE_URL: "${AVM_PUBLIC_BASE_URL:-}"
