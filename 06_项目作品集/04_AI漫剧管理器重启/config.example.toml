# AI漫剧管理器重启版配置文件

[llm]
provider = "newapi"
model = "deepseek-v4-flash"
api_key = ""  # 请勿提交真实 Key，改用环境变量 NEWAPI_API_KEY
base_url = "http://127.0.0.1:3000/v1"
[context]
# 设计文档要求单次调用目标 <= 80k tokens。这里用粗略估算做硬预算保护。
max_tokens = 80000

[project]
default_narrative_style = "节奏清晰，镜头语言服务情绪，不额外扩写情节"
default_visual_style = "cinematic anime, expressive lighting, consistent character design"

[video_prompt]
# 全局风格约束前缀。修改此处后下次生成即生效（已生成的不受影响）。
style_contract = '''
## 视觉美术：大面积留白的"胶片纪实风"与空间坍缩

色彩与影调：中低饱和度、带微粒感（Grain）的复古胶片色调。随剧情由童年走向中年，色彩整体由暖入冷，光影逐渐暗淡，视觉呈现"生命的流逝与干涸"。

空间叙事：
- 室内（两人共同居住的房间/客厅/厨房）：光影、尘埃、生活痕迹微观写实，建构极度安全的"温床感"。
- 外部空间（学校、职场、街景）：大面积留白或模糊化，背景路人去五官/灰度化/直接省略，宣告"外界的虚无"。

构图：大量使用POV限制视角和深焦特写（手部触碰、视线错位、落寞背影），规避宏大全景，营造窒息私密感。

## 叙事与节奏

减法戏剧：拒绝夸张肢体语言、颜艺、Q版表情。日式艺术电影克制演出风格。戏剧张力压在日常对话潜台词与微表情中。
时间流逝：通过季节蒙太奇、面部线条衰老、服装质感变化表现时间，禁止"几年后"字幕。

## 声音设计

台词：极度生活化念白（接近Monologue低声絮语），放大呼吸声/吞咽声/衣物摩擦声，构建"两人绝对领域"。
环境音：大面积环境音留白（蝉鸣、雨声、钟表滴答），强化"世界一片死寂"的孤独感。
音乐：极简主义钢琴单音或微弱电子氛围乐，严禁高亢情绪化管弦乐OST。

## 镜头语言

固定长镜头为主，减少切场。镜头如沉默第三者静静凝视。规避频繁运镜。

## 核心风格锚定

"披着日常温床外衣的、去娱乐化的、纯文学式极简主义视觉长诗。"

## 违禁词（以下词语禁止出现在生成的提示词输出中）

血液飞溅、喷血、鲜血淋漓、血池、断头血、内脏出血、血腥场面、分尸、碎尸、斩首、砍头、挖眼、掏心、剥皮、凌迟、虐杀、酷刑、断肢、爆头、穿刺、撕咬、屠杀、灭门、焚尸、鞭尸、尸横遍野、血肉模糊、骨裂、脑浆、内脏外露、残肢断臂、全裸、半裸、袒胸露背、露脐、露臀、裸体、赤裸、性感暴露、挑逗性裸露、低俗姿势、酥胸半露、衣不蔽体、色情、淫秽、嫖娼、卖淫、性交易、一夜情、通奸、乱伦、恋童、兽交、约炮、打炮、床上戏、胸器、美腿诱惑、暧昧低俗、艳舞、脱衣舞、乳房、阴部、阴茎、臀部、血腥祭祀、活人献祭、血咒、尸变、僵尸吸血、自残、自杀、暴力教唆、聚众斗殴、黑帮火拼、恐怖袭击、邪教仪式、极端宗教
'''

# 每段视频最大时长（秒）
max_segment_duration = 15.0
