[project]
name = "ai-manga-manager-reboot"
version = "0.1.0"
description = "AI漫剧管理器重启版 - 小说到图片/视频提示词的受控 agent 管线"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "typer[all]>=0.12",
    "rich>=13",
    "pydantic>=2",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.30",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "openai>=1",
    "tomli>=2;python_version<'3.11'",
    "json-repair>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
manga = "manga_manager.cli:app"
manga-web = "manga_manager.api:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manga_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
